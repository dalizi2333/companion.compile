  <title id="ot">罗辑旧机（iPhone X 轮廓）· 正面碎屏（2026-11-01）</title>
  <desc id="od">银色不锈钢中框、黑色正面玻璃、顶部宽扁刘海（92×13，宽≈56%机屏宽、高≈真机等比——iPhone X 的"宽"正是年代识别点）；屏幕四周一档黑色玻璃边框（6px，2.5D 圆边），屏内圆角 18 ≈ 刘海高度；屏幕点亮显示暖底电子小说阅读界面，裂纹自刘海下角向外扩散、避开正文主体。第 1、2 章道具状态。机身圆角 18 ≈ 实机 10% 机宽。</desc>
