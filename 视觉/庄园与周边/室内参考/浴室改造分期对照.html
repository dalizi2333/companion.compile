<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>浴室改造分期对照</title><style>body{margin:24px;background:#f6f7f9;color:#243343;font:15px/1.7 system-ui}main{display:grid;grid-template-columns:1fr 1fr;gap:24px}img{width:100%;background:white}@media(max-width:850px){main{display:block}}</style><h1>从普通房间装入浴缸，到专门建造洗浴空间</h1><p>v2：主卧旧浴室保留原改造痕迹；罗辑试过空置老人房浴室后固定在西翼洗浴，42-L洗浴与左手毛巾动作落右图。原家主仍习惯主卧旧浴室。</p><main><article><h2><a href="罗辑浴室布局俯视图.html">罗辑浴室布局俯视图</a></h2><img src="罗辑浴室布局俯视图.svg"><p>主卧旧浴室：普通房间逐步改成洗浴；保留使用能力及历史痕迹，不再绑定42-L镜头。</p></article><article><h2><a href="老人浴室布局俯视图.html">老人浴室布局俯视图</a></h2><img src="老人浴室布局俯视图.svg"><p>西翼浴室：1890年代原生洗浴工程→后加淋浴与暖季补热→罗辑后期常用；42-L左手毛巾见西墙。</p></article></main><p>初始房间具体名称、设备型号与施工构造待定；正文不改，历史痕迹不以牺牲防水、排水和使用条件实现。</p></html>
