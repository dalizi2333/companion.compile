<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="900" viewBox="0 0 1100 900"><style>text{font:16px system-ui,sans-serif;fill:#263847}.small{font-size:13px}.title{font-size:23px;font-weight:600}</style><rect width="1100" height="900" fill="#f5f6f7"/><text x="30" y="36" class="title">草台班子 · 基础材料分期与地面改造</text><text x="30" y="65">平面仅示方位，精确米制分区见JSON；剖面不按厚度或基础深度比例。</text><rect x="35" y="100" width="510" height="410" fill="#e6e3db" stroke="#53616d"/><text x="43" y="124">主体平面：北↑，无可用−1层</text><rect x="55" y="140" width="470" height="340" fill="#edf1f5" stroke="#53616d"/><text x="63" y="164">石砌周边与木梁地板（承重布局待深化）</text><rect x="175.89999999999998" y="200.4" width="75" height="48" fill="#b8b0a2" stroke="#53616d"/><text x="183.89999999999998" y="224.4">T1</text><rect x="152.5" y="363.6" width="75" height="48" fill="#b8b0a2" stroke="#53616d"/><text x="160.5" y="387.6">T2</text><text x="55" y="535">T1：C2旁小型基座；T2：陆侧门厅试作地坪。</text><text x="55" y="560">平面框为关系示意，精确分区顶点见配套JSON。</text><rect x="590" y="100" width="470" height="100" fill="#d0c3aa" stroke="#53616d"/><text x="598" y="124">1850年代：木地板＋木梁</text><rect x="590" y="200" width="470" height="100" fill="#f3f1ed" stroke="#53616d"/><text x="598" y="224"></text><rect x="590" y="200" width="100" height="210" fill="#b9b5ac" stroke="#53616d"/><text x="598" y="324">石墙</text><rect x="950" y="200" width="110" height="210" fill="#b9b5ac" stroke="#53616d"/><text x="958" y="324">石墙</text><rect x="770" y="200" width="90" height="210" fill="#b9b5ac" stroke="#53616d"/><text x="778" y="344">石墩</text><rect x="590" y="410" width="470" height="65" fill="#d4cebd" stroke="#53616d"/><text x="598" y="434">地层／岩面：埋深随实际地形，不定统一尺寸</text><text x="590" y="520">石墙/石墩上托木梁；间隙不作房间，混凝土仅局部。</text><text x="35" y="615" class="title">现代客厅／卧室地面：先修基层，再装适配系统</text><rect x="35" y="640" width="1025" height="38" fill="#d5b997" stroke="#53616d"/><text x="43" y="664">表层木地板：可择材复用；厚毯热阻另核</text><rect x="35" y="678" width="1025" height="44" fill="#e7bc92" stroke="#53616d"/><text x="43" y="702">轻型干式水地暖／导热构造（候选，不画施工盘管）</text><rect x="35" y="722" width="1025" height="44" fill="#dce3be" stroke="#53616d"/><text x="43" y="746">保温＋承托；防潮、通风与边界一起设计</text><rect x="35" y="766" width="1025" height="44" fill="#c4bfb4" stroke="#53616d"/><text x="43" y="790">原木梁／石基经检查后保留或局部修复</text><text x="35" y="850" class="small">门槛标高、楼梯首级、承载与潮气控制未验算；灰块不是实测梁位。禁止据此切旧石基或全封通风。</text></svg>