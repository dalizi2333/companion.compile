<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>草台班子 · 主楼三维拓扑定稿</title><style>

<div id="house-model">
<style>
 #house-model{display:grid;gap:calc(var(--font-size-base) * .75);color:var(--foreground)}
 #house-model .hm-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
 #house-model .hm-view{position:relative;width:100%;height:550px;overflow:hidden;touch-action:none}
 #house-model canvas{display:block;width:100%;height:100%}
 #house-model .hm-labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
 #house-model .hm-label{position:absolute;left:0;top:0;white-space:nowrap;padding:2px 4px;background:color-mix(in srgb,var(--background) 89%,transparent);color:var(--foreground)}
 #house-model .hm-secondary{color:var(--muted-foreground)}

 #house-model .hm-info{min-height:2.5em}
 @media(max-width:540px){#house-model .hm-view{height:430px}}
</style>
<h2>草台班子 · 主楼拓扑＋影院配套预留</h2>
<div class="hm-toolbar" aria-label="楼层">
 <button type="button" class="btn" data-mode="east" aria-pressed="true">东翼下层特写</button>
 <button type="button" class="btn" data-mode="cinema" aria-pressed="true">西翼／影院配套</button>
 <button type="button" class="btn" data-mode="main" aria-pressed="true">主生活层</button>
 <button type="button" class="btn" data-mode="all" aria-pressed="false">整栋合拢</button>
 <button type="button" class="btn" data-mode="lower" aria-pressed="false">下层后勤</button>
 <button type="button" class="btn" data-mode="upper" aria-pressed="false">主体上层</button>
</div>
<div class="hm-toolbar" aria-label="观察方向">
 <button type="button" class="btn" data-view="lake">从湖侧看</button>
 <button type="button" class="btn" data-view="land">从陆侧看</button>
 <button type="button" class="btn" data-view="top">俯看</button>
 <button type="button" class="btn" data-view="section">从西侧看落差</button>
 <label class="form-check"><input class="form-check-input" type="checkbox" checked><span class="form-check-label">房间名</span></label>
</div>
<p class="text-small text-muted">厕所分工：主楼本体与东翼无厕所，保留西翼厕所。地图待补：主楼旁独立老厕屋（具体位置与尺寸待定）。</p>
<div class="hm-view"><div class="hm-labels"></div></div>
<div class="hm-info text-small" aria-live="polite"></div>
<div class="text-small text-muted">拖动旋转 · 滚轮缩放 · 点击房间查看连接</div>
<div class="text-small text-muted">2026-11-05 拓扑与粗轮廓定稿 · 尺寸、门窗与构造仍为工作值 · 不含家具定稿 · 影院南侧新增收藏/放映整备室与定制空调设备间；全家阶梯座席待改图 · 棕色 C1–C4、C6 为烟囱核心占位（C5取消），点击查看；各层同坐标贯通</div>
</div>
