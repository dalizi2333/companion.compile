<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>浴室改造分期对照</title><style>body{margin:24px;background:#f6f7f9;color:#243343;font:15px/1.7 system-ui}main{display:grid;grid-template-columns:1fr 1fr;gap:24px}img{width:100%;background:white}@media(max-width:850px){main{display:block}}</style><h1>从普通房间装入浴缸，到专门建造洗浴空间</h1><p>两图显示现状与沿革痕迹，不是同一房间的新旧版本。罗辑浴室不是复古主题新浴室；老人浴室不是后来才从客房改出来的。</p><main><article><h2><a href="罗辑浴室布局俯视图.html">罗辑浴室布局俯视图</a></h2><img src="罗辑浴室布局俯视图.svg"><p>普通房间→1890年代装热水与浴缸→局部湿区换基层，保留干区木作→暖季补热。</p></article><article><h2><a href="老人浴室布局俯视图.html">老人浴室布局俯视图</a></h2><img src="老人浴室布局俯视图.svg"><p>1890年代原建固定浴缸/热水/排水/水暖→后加淋浴与扶手→后加浴霸模块。</p></article></main><p>初始房间具体名称、设备型号与施工构造待定；正文不改，历史痕迹不以牺牲防水、排水和使用条件实现。</p></html>
