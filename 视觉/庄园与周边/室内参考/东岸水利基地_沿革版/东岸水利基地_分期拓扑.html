<script>
const facilities=[["gate", 1113, 1952, 64, "旧工程路主哨", "原为护水源和登记人员、车马的入口岗。位置只表达在分流上游，旧路与新公路接法待定。", 0, 0], ["gate", 1113, 1952, 64, "东侧主哨", "沿用水利经营期入口岗的职能。若旧岗与新入口错位，可短迁岗亭。公园时期把访客导向停车和步道。", 1, 2], ["quarters", 1102, 1915, 64, "安保生活院", "与主哨近接，安排轮班过夜、洗漱、烘干和交班。北岸承担庄园日常补给及内部安保。", 0, 2], ["dam", 1032, 1939, 63, "坝务值班", "独立值班点，走坝下检修通路。实际坝下出口、过桥高差和接路另核。", 0, 2], ["storage", 1076, 1880, 60, "应急储备仓", "优先服务东岸值守、坝务和冬季清雪。水运期封冻前补仓，停航后靠庄园自产和既有库存。", 0, 2], ["garage", 1220, 1767, 72, "公路除雪车库", "改公路后另建，靠道路外侧设置独立出车口。设备服务公路及山路，车辆维修和日常补给由北岸支援。", 1, 2], ["hall", 1010, 1830, 72, "职工食堂", "旧水利工程伙房旁的大空间，兼集会。", 0, 0], ["hall", 1010, 1830, 72, "员工餐厅／宴会厅", "原职工食堂改造。38-L员工餐和60-DL晚宴共用主厅，布置随使用切换。", 1, 2], ["kitchen", 1083, 1830, 65, "工程伙房", "与食堂并接，保留储料和厨房作业关系。", 0, 0], ["kitchen", 1083, 1830, 65, "中央厨房", "与厅相邻。27／31／38-L需要备餐、热厨、烘焙、储藏、冻存、洗消及卸货，并留厨房望湖视线。", 1, 2], ["gallery", 1009, 1802, 64, "厅外玻璃廊", "从主厅直接进入，关门后仍能看见厅内。60-DL需要一小段停步对话的位置。此处表达邻接，廊朝向待定。", 2, 2], ["delivery", 1142, 1810, 48, "后勤卸货", "从内支路转入，接厨房收货和储藏。与食堂访客到达分开。回转和坡道待核。", 0, 2], ["park", 1080, 1766, 61, "停车／公厕", "公园期访客先停车，经接待、公厕与步道进入原公共区。接管后改内部使用。", 1, 2], ["dock", 918, 1744, 60, "公共码头", "公园期开设，按现湖位设码头及划艇棚，经下岸步道到达。具体泊位待核。", 1, 2], ["grass", 992, 1744, 60, "草坪／观景", "公共休憩与看湖，步行串联岸边和餐厅。", 1, 2], ["horse", 1038, 1686, 60, "马厩／调教场", "放在远离餐饮前场的南侧陆地，接牵骑线。公园期对客，接管后转内部。", 1, 2]];
const phases=[
 ['水利与窄轨期','水源值守、工程伙房和坝务独立运行。轨道清雪设备由南岸旧整备场出动。平时靠水运补给，封冻后用储备和庄园自产接续。'],
 ['约1970年改路与公园期','窄轨改公路。东岸单建道路除雪车库，原整备场转景区。访客经停车与步道去湖岸，值守院和坝务继续独立运作。'],
 ['晚宴与故事期','旧食堂兼员工餐厅与宴会厅，增设玻璃外廊，厨房与后勤卸货相连。北岸负责常规补给、维修及内部安保，东岸保留入口和坝务的冬季留守能力。']
];
const nodes=[...document.querySelectorAll('.node')],buttons=[];
function select(node){
 nodes.forEach(n=>n.classList.toggle('selected',n===node));
 document.querySelector('#nodeTitle').textContent=node?facilities[node.dataset.i][4]:'选择设施';
 document.querySelector('#nodeNote').textContent=node?facilities[node.dataset.i][5]:'点击图中标块查看用途和设计依据。';
}
function show(phase){
 buttons.forEach((b,i)=>b.setAttribute('aria-pressed',i===phase));
 document.querySelector('#phaseTitle').textContent=phases[phase][0];
 document.querySelector('#phaseNote').textContent=phases[phase][1];
 document.querySelector('#road').classList.toggle('rail',phase===0);
 nodes.forEach((n,i)=>n.toggleAttribute('hidden',phase<facilities[i][6]||phase>facilities[i][7]));
 document.querySelectorAll('.phase-route').forEach(n=>n.toggleAttribute('hidden',phase<+n.dataset.from||phase>+n.dataset.to));
 select(null);
}
phases.forEach(([title],i)=>{const b=document.createElement('button');b.textContent=title;b.onclick=()=>show(i);buttons.push(b);document.querySelector('#phases').append(b);});
nodes.forEach(node=>{node.onclick=()=>select(node);node.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(node);}};});
show(2);
</script></html>
